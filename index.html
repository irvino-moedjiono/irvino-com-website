<html>
	<head>
		<title>VNIX</title>
		<link rel="icon" type="image/x-icon" href="assets/css/images/favicon.ico">
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<script>
			(function () {
				var allowed = { morning: 1, day: 1, sunset: 1, night: 1 };
				var param = new URLSearchParams(window.location.search).get('tod');
				var hour = new Date().getHours();
				var tod = allowed[param] ? param
					: (hour >= 6 && hour < 10) ? 'morning'
					: (hour >= 10 && hour < 17) ? 'day'
					: (hour >= 17 && hour < 21) ? 'sunset'
					: 'night';
				document.documentElement.setAttribute('data-tod', tod);
			})();
		</script>
		<link rel="stylesheet" href="assets/css/main.css?v=tod-wide2" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="bg"></div>
			<div id="overlay"></div>
			<div id="main">

				<!-- Header -->
					<header id="header">
						<h1>Irvino Moedjiono</h1>
						<p>Site Reliability Engineer &nbsp;&bull;&nbsp; Sailor Wannabe</p>
						<nav>
							<ul>
								<li><a href="https://www.linkedin.com/in/irvino/" class="icon brands fa-linkedin-in"><span class="label">linkedin</span></a></li>
								<li><a href="https://github.com/irvino-moedjiono" class="icon brands fa-github"><span class="label">Github</span></a></li>
								<li><a href="https://www.credly.com/users/irvino-moedjiono/badges" class="icon solid fa-award"><span class="label">Credly</span></a></li>
								<li><a href="mailto:irvino@irvino.com" class="icon solid fa-envelope"><span class="label">Email</span></a></li>
							</ul>
						</nav>
					</header>

				<!-- Footer -->
					<footer id="footer">
						<span class="copyright">&copy; 2026 VNIX.</span>
					</footer>

			</div>
		</div>
		<script>
			window.onload = function() { document.body.classList.remove('is-preload'); }
			window.ontouchmove = function() { return false; }
			window.onorientationchange = function() { document.body.scrollTop = 0; }
			function applyTimeOfDay() {
				var allowed = { morning: 1, day: 1, sunset: 1, night: 1 };
				if (allowed[new URLSearchParams(window.location.search).get('tod')]) return;
				var hour = new Date().getHours();
				var tod = (hour >= 6 && hour < 10) ? 'morning'
					: (hour >= 10 && hour < 17) ? 'day'
					: (hour >= 17 && hour < 21) ? 'sunset'
					: 'night';
				document.documentElement.setAttribute('data-tod', tod);
			}
			setInterval(applyTimeOfDay, 60000);
		</script>
	</body>
